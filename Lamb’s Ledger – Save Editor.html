<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamb’s Ledger – Save Editor</title>
<style>
:root{--bg:#f1e9dc;--sf:#fbf6ec;--tx:#2a1b2e;--mu:#7a6b7d;--ac:#a3202b;--ln:#d9ccb8;--ok:#3f7a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1220;--sf:#271a2d;--tx:#efe6d8;--mu:#a596a8;--ac:#e0505a;--ln:#3d2c44;--ok:#8fbf7f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1220;--sf:#271a2d;--tx:#efe6d8;--mu:#a596a8;--ac:#e0505a;--ln:#3d2c44;--ok:#8fbf7f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:760px;margin-inline:auto;padding:0 14px 90px}
h1{font:700 30px/1.1 Palatino,"Palatino Linotype",Georgia,serif;margin:22px 0 4px}
h2{font:700 20px Palatino,Georgia,serif;margin:22px 0 8px}
p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row>label,.row>.k{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:9px;font:inherit;min-width:0}
input[type=number]{width:120px}input[type=text]{width:140px}input[type=search]{width:100%}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac)}
textarea{width:100%;height:50vh;font:12px/1.4 ui-monospace,Menlo,monospace}
button{font:inherit;font-weight:600;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:8px;padding:9px 12px;min-height:40px}
button.p{background:var(--ac);color:#fff}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
nav button{white-space:nowrap}nav button.on{background:var(--ac);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center}
.bar span{flex:1;font-size:14px;color:var(--mu)}
.err{color:var(--ac);font-weight:600}.k small{display:block;color:var(--mu);font-size:11px;font-weight:400}.ic{display:inline-flex;width:36px;height:36px;flex:none;align-items:center;justify-content:center;font-size:22px;background:var(--bg);border:1px solid var(--ln);border-radius:9px}[hidden]{display:none!important}details{margin:6px 0}summary{cursor:pointer;font-weight:600;padding:6px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
</style></head><body>
<h1>Lamb’s Ledger</h1>
<p class="mu">A save editor for Cult of the Lamb. Everything runs in your browser; your file never leaves your phone.</p>
<div id="app"></div>
<div class="bar" id="bar" hidden><span id="st">No changes yet</span><button id="rs">Reset</button><button id="bk">Backup</button><button class="p" id="sv">Save file</button></div>
<script>
let D=null,raw='',fname='slot_0.json',edits=0,tab='quick',L={},rawBuf=null,chain=[],bom=false,zb=null;
try{L=JSON.parse(localStorage.getItem('lbl')||'{}')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function*walk(o,p=[]){if(o&&typeof o==='object'){for(const k of Object.keys(o))yield*walk(o[k],p.concat(Array.isArray(o)?+k:k))}else yield[p,o]}
const get=p=>p.reduce((o,k)=>o[k],D);
const key=p=>p.join('.');
function put(p,v){get(p.slice(0,-1))[p[p.length-1]]=v;edits++;stat()}
function stat(){$('#st').textContent=edits?edits+' change'+(edits>1?'s':'')+' not saved':'No changes yet'}
function inp(p,v){const a=`data-p="${esc(JSON.stringify(p))}"`;
 if(typeof v==='boolean')return`<input type="checkbox" ${a} data-t="b" ${v?'checked':''} aria-label="${esc(key(p))}">`;
 if(typeof v==='number')return`<input type="number" step="any" inputmode="decimal" ${a} data-t="n" value="${v}" aria-label="${esc(key(p))}">`;
 if(v===null)return'<i class="mu">null</i>';
 return`<input type="text" ${a} data-t="s" value="${esc(v)}" aria-label="${esc(key(p))}">`}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.lbl){L[d.lbl]=t.value;try{localStorage.setItem('lbl',JSON.stringify(L))}catch(x){}return}
 if(d.skin!==undefined){setSkin(+d.skin,t.value,t);return}
 if(d.copy!==undefined){if(t.value!=='')copyLook(+d.copy,+t.value,t);t.value='';return}
 if(d.chk){const a=D[d.chk],id=isNaN(Number(d.id))?d.id:Number(d.id),i=a.indexOf(id);if(t.checked&&i<0)a.push(id);if(!t.checked&&i>=0)a.splice(i,1);edits++;stat();return}
 if(!d.p)return;const p=JSON.parse(d.p);
 const v=d.t==='b'?t.checked:d.t==='n'?Number(t.value):d.t==='l'?t.value.split(',').map(s=>s.trim()).filter(s=>s!=='').map(s=>d.s==='1'?s:Number(s)):t.value;
 if(d.t==='n'&&(t.value===''||isNaN(v)))return;
 if(d.t==='l'&&v.some(x=>typeof x==='number'&&isNaN(x)))return;
 put(p,v);if(p[0]==='items'&&p[p.length-1]==='quantity')sync(get(p.slice(0,-1)))});

// ---- detectors ----
function find(test){const out=[];(function rec(o,p){if(!o||typeof o!=='object')return;
 if(Array.isArray(o)&&o.length&&o.every(x=>x&&typeof x==='object'&&!Array.isArray(x))&&test(o)){out.push(p);return}
 for(const k of Object.keys(o))rec(o[k],p.concat(Array.isArray(o)?+k:k))})(D,[]);return out}
const kk=(o,re)=>Object.keys(o).find(k=>re.test(k));
const invs=()=>find(a=>a.every(x=>kk(x,/^type$/i)&&kk(x,/^quantity$/i))).filter(p=>p.length<2);
const fols=()=>find(a=>a.length&&a.every(x=>kk(x,/^name$/i)&&Object.keys(x).length>5)).filter(p=>p.length<2);

// ---- tabs ----
const PRE=[['Currency',/gold|coin/i],['Devotion and faith',/devotion|faith|fervou?r/i],['Health and hearts',/health|heart/i],['Food and hunger',/food|hunger|meal/i],['Doctrine and rituals',/doctrine|ritual/i],['Days and time',/day|time/i]];
function quick(){let h='<p class="mu">Fields found by name. Names depend on the game version, so check the Search tab if something is missing.</p>';
 const leaves=[...walk(D)].filter(([p,v])=>typeof v==='number'&&p.length<=3&&typeof p[p.length-1]==='string');
 for(const[n,re]of PRE){const m=leaves.filter(([p])=>re.test(p[p.length-1])).slice(0,14);if(!m.length)continue;
  h+=`<h2>${n}</h2><div class="card">`+m.map(([p,v])=>`<div class="row"><span class="k">${esc(key(p))}</span>${inp(p,v)}</div>`).join('')+'</div>'}
 return h+(h.includes('card')?'':'<div class="card">No common fields matched. Open Search to browse every value.</div>')}

function res(){const ps=invs();if(!ps.length)return'<div class="card">No item list found. Open Search and look for entries with “quantity”.</div>';
 return'<p class="mu">Item types appear as numbers. Match each one to your in-game count, then label it. Labels stay on this device only.</p>'+ps.map((p,ix)=>{
  const a=get(p);return`<h2>${esc(key(p))||'Items'} (${a.length})</h2>
  <div class="tools"><input type="number" id="bulk${ix}" value="999" style="width:100px"><button data-act="all" data-ix="${ix}">Set all to this</button><button data-act="raise" data-ix="${ix}">Raise only lower ones</button></div><div class="tools"><input type="number" id="nt${ix}" placeholder="Item ID" style="width:100px"><input type="number" id="nq${ix}" value="999" style="width:100px"><button data-act="add" data-ix="${ix}">Add or set item</button></div>
  <div class="card">`+a.map((it,i)=>{const tk=kk(it,/^type$/i),qk=kk(it,/^quantity$/i),id='t'+it[tk];
   return`<div class="row"><input type="text" style="width:110px" placeholder="${it[tk]===20?'Gold?':'Type '+esc(it[tk])}" value="${esc(L[id]||'')}" data-lbl="${id}" aria-label="Label for type ${esc(it[tk])}">${inp(p.concat(i,qk),it[qk])}<button data-act="max" data-p="${esc(JSON.stringify(p.concat(i,qk)))}">Max</button></div>`}).join('')+'</div>'}).join('')}

function fol(){const ps=fols();if(!ps.length)return'<div class="card">No follower list found. Try Search and look for “Name”.</div>';
 const a=get(ps[0]),p0=ps[0];const nums=[...new Set(a.flatMap(f=>Object.keys(f).filter(k=>typeof f[k]==='number')))].sort();
 return`<h2>${a.length} followers</h2><div class="card"><p class="mu">Change one stat for every follower at once.</p><div class="tools"><select id="fk">${nums.map(k=>`<option>${esc(k)}</option>`).join('')}</select><input type="number" id="fv" value="0" style="width:100px"><button data-act="fol">Apply to all</button></div><div class="tools"><button data-act="heal">Heal and cheer everyone</button></div></div>`+
 a.map((f,i)=>{const nk=kk(f,/^name$/i);return`<details class="card"><summary>${esc(f[nk])}</summary>`+Object.keys(f).filter(k=>f[k]===null||typeof f[k]!=='object').map(k=>`<div class="row"><span class="k">${esc(k)}</span>${inp(p0.concat(i,k),f[k])}</div>`).join('')+'</details>'}).join('')}

let q='',numOnly=false;
function srch(){return`<input type="search" id="q" placeholder="Search field names, e.g. gold, level, unlock" value="${esc(q)}" aria-label="Search fields"><div class="tools"><label><input type="checkbox" id="no" ${numOnly?'checked':''}> Numbers only</label></div><div id="sr">${srRows()}</div>`}
function srRows(){const s=q.toLowerCase();let n=0,h='';
 for(const[p,v]of walk(D)){if(numOnly&&typeof v!=='number')continue;const k=key(p);if(s&&!k.toLowerCase().includes(s))continue;if(++n>120)break;h+=`<div class="row"><span class="k">${esc(k)}</span>${inp(p,v)}</div>`}
 return n?(n>120?'<p class="mu">Showing first 120 matches. Type more to narrow.</p>':'')+`<div class="card">${h}</div>`:'<div class="card">Nothing matches. Try a shorter word.</div>'}

function rawT(){return`<p class="mu">Advanced: edit the whole file as text. Changes apply when you tap Apply.</p><textarea id="rw" spellcheck="false">${esc(JSON.stringify(D,null,2))}</textarea><div class="tools"><button class="p" data-act="raw">Apply text</button></div><p id="re" class="err"></p>`}

function draw(){const T=[['quick','Quick'],['res','Items'],['fol','Followers'],['unl','Unlocks'],['rev','Review'],['srch','Search'],['rawT','Raw']];
 $('#app').innerHTML=`<nav>${T.map(([k,n])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</nav><div id="pane">${({quick:quick2,res:res2,fol:fol2,unl:unl2,rev,srch,rawT})[tab]()}</div>`}

// ---- start screen ----
function start(msg){$('#app').innerHTML=`<div class="card"><h2 style="margin-top:0">Open your save</h2>
<p>Pick your save file (for example <b>slot_0</b>). Close the game first and keep a copy of the original.</p><p class="mu">Opens Cult of the Lamb port saves (slot_0 and meta_0), plus plain JSON, gzip, zlib, base64 and MessagePack, and writes the same format back. Encrypted saves cannot be opened.</p>
${msg?`<p class="err">${msg}</p>`:''}<p><input type="file" id="f" accept=".json,.txt,.save,*/*"></p></div>
<div class="card"><b>Tips</b><p class="mu">Android hides other apps’ folders on newer versions, so you may need a file manager that can reach the game’s data folder. After saving, copy the edited file back over the original, keeping its name. Back up first, and use the Backup button.</p></div>`;
 $('#f').onchange=async e=>{const f=e.target.files[0];if(!f)return;fname=f.name;rawBuf=new Uint8Array(await f.arrayBuffer());
  try{const r=await load(rawBuf);D=r.D;chain=r.ch;raw=r.t;orig=JSON.stringify(D);edits=0;tab='quick';$('#bar').hidden=false;stat();draw()}
  catch(x){const h=rawBuf.subarray(0,32),pv=new TextDecoder().decode(rawBuf.subarray(0,60)).replace(/[^\x20-\x7e]/g,'.');
   const hi=new Set(rawBuf.subarray(0,256)).size>150;
   start(`Could not read this format.${hi?' The bytes look random, so the file is probably encrypted.':''}<br><span class="mu">If you want help adding support, send me this:</span><pre style="white-space:pre-wrap;font-size:12px;user-select:all">name: ${esc(f.name)}\nsize: ${f.size} bytes\nhex: ${hex(h)}\ntext: ${esc(pv)}</pre>`)}}}

// ---- names (community lists: wheels35.github.io/CultoftheLamb) ----
const IT={1:'Logs',2:'Stone',6:'Meat',8:'Berry bush seeds',9:'Bones',20:'Gold coins',21:'Berries',22:'Heart of the Heretic',26:'Tarot card',28:'Salmon',29:'Menticide mushroom',33:'Minnow',34:'Tuna',35:'Grass',39:'Poop',43:'Small gift',44:'Big gift',45:'Flower necklace',46:'Feather necklace',47:'Skull necklace',48:'Nature necklace',49:'Moon necklace',50:'Pumpkin',51:'Pumpkin seeds',55:'Camellia',61:'Rotten meat',62:'Follower meat',63:'Rotten follower meat',70:'Menticide mushroom spores',72:'Camellia seeds',81:'Wooden planks',82:'Stone blocks',83:'Gold nugget',86:'Gold bars',89:'Crystal shards',90:'Spider silk',91:'Crab',92:'Lobster',93:'Octopus',94:'Squid',95:'Swordfish',96:'Blowfish',97:'Beetroot',98:'Beetroot seeds',101:'Eye of the Witness',102:'Cauliflower',103:'Cauliflower seeds',105:'Morsel',114:'Holy talisman',117:'Shell'};
const MEAL={32:'Paltry Pumpkin Soup',57:'Grassy Gruel',58:'Heart Meat Broth',59:'Splendid Vegetable Feast',60:'Tasty Fish Meal',65:'Minced Follower Meat',69:'Bowl of Poop',99:'Delicious Fish Feast',100:'Pungent Fish Stew',106:'Basic Berry Bowl',107:'Cheery Cauliflower Chowder',108:'Meager Mixed Meal',109:'Modest Mixed Meal',110:'Magnificent Mixed Meal',111:'Deadly Dish',112:'Stringy Meat Gruel',113:'Mighty Meat Feast'};
const TAROT={0:'The Hearts I',1:'The Hearts II',2:'The Hearts III',3:'The Lovers I',4:'The Lovers II',5:'All Seeing Sun',6:'Weeping Moon',7:'Gift From Below',8:'The Arachnid',9:'Diseased Heart',10:'True Sight',11:'Fervour’s Host',12:'Death’s Door',13:'The Deal',14:'Telescope',15:'Hands of Rage',16:'Nature’s Boon',17:'The Burning Dead',18:'Ambrosia',31:'The Path',32:'Divine Strength',33:'Master of the Art',34:'Fervour’s Harvest',35:'Soul Snatcher',36:'Shield of Faith',37:'The Bomb',38:'Ichor Earned',39:'Ichor Lingered',40:'Mithridatism',41:'Blazing Trail',42:'Fortune’s Blessing',44:'Divine Curse',45:'Strength from Within',46:'Strength from Without',47:'Neptune’s Curse',48:'Rabbit’s Foot'};
const DIV={80:'Tabernacle III',36:'Lumberyard II',78:'Shrine flame III',31:'Stone mine II',137:'Healing bay II',211:'Missionary III',124:'Outhouse II',156:'Demonic summoning circle III',126:'Devotion harvest totem',84:'Cult upgrade IV (left)',79:'Cult upgrade IV (right)',91:'Ritual cooldowns',82:'Shrine flame II',118:'Grand shelter',35:'Refinery II',140:'Bone decorations',213:'Farmer station II',14:'Compost',125:'Trap scarecrow',83:'Cult upgrade III (left)',75:'Cult upgrade III (right)',34:'Refinery',116:'Propaganda',210:'Missionary II',50:'Confession booth',155:'Demonic summoning circle II',89:'Cheaper rituals',121:'Fertiliser silo',73:'Shrine flame bundle (part 1)',81:'Shrine flame bundle (part 2)',135:'Harvest totem',144:'Janitor station',136:'Healing bay',46:'Outhouse',64:'Cult upgrade II (left)',72:'Cult upgrade II (right)',45:'Prison',33:'Lumberyard',76:'Tabernacle',32:'Stone mine',74:'Offering statue',117:'Missionary',55:'Shelter',145:'Demonic summoning circle',139:'Decorations',44:'Scarecrow',134:'Body pit',43:'Farm',51:'Sleeping beds',52:'Farming bundle'};
const NAME={...MEAL,...IT};
const MAPS={PlayerFoundTrinkets:TAROT,RecipesDiscovered:MEAL,UnlockedUpgrades:DIV};
const TT={PlayerFoundTrinkets:['Tarot cards','Cards you have found'],RecipesDiscovered:['Cooking recipes','Recipes your cult can cook'],UnlockedUpgrades:['Divine inspiration tree','Buildings and cult upgrades you have unlocked']};
const FL={PLAYER_HEALTH:'Current health',PLAYER_TOTAL_HEALTH:'Max health',PLAYER_BLUE_HEARTS:'Blue hearts',PLAYER_BLACK_HEARTS:'Black hearts',PLAYER_SPIRIT_HEARTS:'Spirit hearts',PLAYER_SPIRIT_TOTAL_HEARTS:'Max spirit hearts',PLAYER_STARTING_HEALTH:'Starting health',PLAYER_STARTING_HEALTH_CACHED:'Starting health (copy)',PLAYER_ARROW_AMMO:'Arrows now',PLAYER_ARROW_TOTAL_AMMO:'Max arrows',Level:'Lamb level',XP:'Lamb XP',AbilityPoints:'Divine inspiration points',WeaponAbilityPoints:'Weapon points',FollowerTokens:'Follower tokens',DiscipleLevel:'Disciple level',DiscipleXP:'Disciple XP',DiscipleAbilityPoints:'Disciple points',Souls:'Souls',BlackSouls:'Black souls',CurrentKeyPieces:'Key pieces',CultFaith:'Cult faith (0 to 100)',StaticFaith:'Base faith',CurrentDayIndex:'Current day',CurrentGameTime:'Game clock',CurrentCultLevel:'Cult level',playerDeaths:'Deaths',KillsInGame:'Kills',PlayTime:'Play time',FollowerCount:'Followers',StructureCount:'Buildings',DeathCount:'Deaths',PercentageCompleted:'Completion %',CURRENT_WEAPON:'Current weapon ID'};
[1,2,3,4].forEach(n=>{FL['Dungeon'+n+'GodTears']='God tears (dungeon '+n+')';FL['Dungeon'+n+'Completed']='Dungeon '+n+' completed'});
const nice=k=>FL[k]||k.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/(\d)([A-Za-z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());
const lab=k=>`<b>${esc(nice(k))}</b><small>${esc(k)}</small>`;
function give(id,n){const arr=get(invs()[0]);let it=arr.find(x=>x[kk(x,/^type$/i)]===id);if(it)it[kk(it,/^quantity$/i)]+=n;else{it={type:id,quantity:n,QuantityReserved:0,UnreservedQuantity:n};arr.push(it)}sync(it);edits++;stat();draw()}
function res2(){const ps=invs();if(!ps.length)return`<div class='card'>No item list found in this file.</div>`;
 const p=ps[0],a=get(p),have=new Set(a.map(it=>it[kk(it,/^type$/i)]));
 const opts=Object.keys(IT).filter(i=>!have.has(+i)).sort((x,y)=>IT[x].localeCompare(IT[y])).map(i=>`<option value='${i}'>${IC[i]||''} ${esc(IT[i])}</option>`).join('');
 const G=[[20,1000,'+1000 gold'],[1,100,'+100 logs'],[2,100,'+100 stone'],[9,100,'+100 bones'],[35,100,'+100 grass']];
 return`<h2>Quick gifts</h2><div class='card'><div class='tools'>${G.map(([i,n,l])=>`<button data-act='give' data-id='${i}' data-n='${n}'>${l}</button>`).join('')}</div></div>
<h2>Bulk tools</h2><div class='card'><div class='row'><span class='k'><b>Amount</b><small>used by the buttons below</small></span><input type='number' id='bulk0' value='999'></div>
<div class='tools'><button data-act='all' data-ix='0'>Set all owned to amount</button><button data-act='raise' data-ix='0'>Raise lower ones</button><button data-act='addall'>Add every missing item</button></div>
<div class='tools'><select id='ns'>${opts||`<option value=''>You own every known item</option>`}</select><button data-act='add2'>Add selected</button></div></div>
<h2>You own (${a.length})</h2><input type='search' data-flt='1' placeholder='Search your items' aria-label='Search your items'><div class='card'>`+a.map((it,i)=>{const tk=kk(it,/^type$/i),qk=kk(it,/^quantity$/i),id=it[tk],nm=NAME[id]||L['t'+id];
  return`<div class='row' data-n='${esc((nm||'').toLowerCase())}'>${ico(id)}<span class='k'><b>${esc(nm||'Unknown item')}</b><small>ID ${esc(id)}</small>${nm?'':`<input type='text' style='width:100%;margin-top:4px' placeholder='Name this item' data-lbl='t${id}'>`}</span>${inp(p.concat(i,qk),it[qk])}<button data-act='max' data-p='${esc(JSON.stringify(p.concat(i,qk)))}'>Max</button><button data-act='del' data-i='${i}' aria-label='Remove item'>×</button></div>`}).join('')+'</div>'}
const FM=[['Name','Name'],['XPLevel','Level'],['HP','Health'],['MaxHP','Max health'],['Faith','Faith'],['Happiness','Happiness'],['Satiation','Fullness'],['Rest','Rest'],['Social','Social'],['Illness','Illness'],['Injured','Injury'],['Exhaustion','Exhaustion'],['Starvation','Starvation'],['Dissent','Dissent'],['Age','Age'],['LifeExpectancy','Life expectancy']];
function fol2(){const ps=fols();if(!ps.length)return`<div class='card'>No follower list found in this file.</div>`;
 const p0=ps[0],a=get(p0),nums=[...new Set(a.flatMap(f=>Object.keys(f).filter(k=>typeof f[k]==='number')))].sort();
 const row=(i,k,l)=>`<div class='row'><span class='k'><b>${esc(l)}</b><small>${esc(k)}</small></span>${inp(p0.concat(i,k),a[i][k])}</div>`;
 return`<h2>${a.length} follower${a.length===1?'':'s'}</h2><input type='search' data-flt='1' placeholder='Search followers by name' aria-label='Search followers'><div class='card'><div class='tools'><button data-act='heal'>Heal and cheer everyone</button></div><p class='mu'>Give every follower the same animal form:</p><div class='tools'><select id='sa'>${skinOpts('')}</select><button data-act='skinall'>Apply to all</button></div><p class='mu'>Or set one stat on every follower:</p><div class='tools'><select id='fk'>${nums.map(k=>`<option value='${esc(k)}'>${esc(nice(k))}</option>`).join('')}</select><input type='number' id='fv' value='0' style='width:100px'><button data-act='fol'>Apply to all</button></div></div>`+
 a.map((f,i)=>{const main=FM.filter(([k])=>k in f&&typeof f[k]!=='object'),ks=new Set(main.map(m=>m[0]));
  const rest=Object.keys(f).filter(k=>!ks.has(k)&&(f[k]===null||typeof f[k]!=='object'));

  if(a==='add2'){const s=$('#ns').value;if(s==='')return;mk(+s)}else Object.keys(IT).forEach(i=>{if(+i!==26&&!arr.some(it=>it[kk(it,/^type$/i)]===+i))mk(+i)});edits++;stat();draw()}
 if(a==='on'||a==='off'){const k=t.dataset.k,s=new Set(D[k]);Object.keys(MAPS[k]).forEach(i=>a==='on'?s.add(cv(i)):s.delete(cv(i)));D[k]=[...s];edits++;stat();draw()}
 if(a==='boost'){if(invs().length)[[20,1000],[1,100],[2,100],[9,100],[35,100]].forEach(([i,n])=>give(i,n));if('PLAYER_HEALTH' in D)D.PLAYER_HEALTH=D.PLAYER_TOTAL_HEALTH;if('CultFaith' in D)D.CultFaith=100;edits++;stat();draw()}

 if(a==='raw'){try{D=JSON.parse($('#rw').value);edits++;stat();$('#re').textContent='';draw()}catch(x){$('#re').textContent='Invalid JSON: '+x.message}}
 if(t.id==='sv')enc().then(u=>{dl(fname,u);edits=0;stat()})
 if(t.id==='rs'){if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Tap again';setTimeout(()=>{t.dataset.arm='';t.textContent='Reset'},3000);return}t.dataset.arm='';t.textContent='Reset';load(rawBuf).then(r=>{D=r.D;chain=r.ch;raw=r.t;edits=0;stat();draw()})}
 if(t.id==='bk')dl('backup_'+new Date().toISOString().slice(0,10)+'_'+fname,rawBuf)});

start();
